<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="panSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E6E8EA"/>
      <stop offset="70%" stop-color="#C2C6CA"/>
      <stop offset="100%" stop-color="#9DA3A6"/>
    </linearGradient>
    <linearGradient id="panFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8CCD0"/>
      <stop offset="100%" stop-color="#E2E5E8"/>
    </linearGradient>
    <linearGradient id="muffinGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2BF77"/>
      <stop offset="40%" stop-color="#D98A36"/>
      <stop offset="85%" stop-color="#A65819"/>
      <stop offset="100%" stop-color="#73360A"/>
    </linearGradient>
    <linearGradient id="linerPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E5"/>
      <stop offset="100%" stop-color="#E6D3B8"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E09C7B"/>
      <stop offset="50%" stop-color="#B87352"/>
      <stop offset="100%" stop-color="#8E4828"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#25282B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="20"/>

  <!-- Pan Drop Shadow -->
  <ellipse cx="270" cy="305" rx="220" ry="24" fill="#25282B" opacity="0.10"/>

  <!-- Pan Outer Rim & Floor -->
  <g filter="url(#cardShadow)">
    <rect x="55" y="75" width="430" height="210" rx="30" fill="url(#panSteel)" stroke="#888E92" stroke-width="2"/>
    <rect x="70" y="88" width="400" height="184" rx="20" fill="url(#panFloor)" stroke="#7A8084" stroke-width="1.5"/>
  </g>

  <!-- Side Handles -->
  <rect x="28" y="160" width="30" height="42" rx="9" fill="url(#panSteel)" stroke="#80868A" stroke-width="1.5"/>
  <rect x="36" y="170" width="14" height="22" rx="4" fill="#F2EDE4"/>
  <rect x="482" y="160" width="30" height="42" rx="9" fill="url(#panSteel)" stroke="#80868A" stroke-width="1.5"/>
  <rect x="490" y="170" width="14" height="22" rx="4" fill="#F2EDE4"/>

  <!-- 2x3 Cupcake Tray (6.25" x 8.70" Insert) in Left Bay -->
  <g filter="url(#cardShadow)">
    <rect x="78" y="93" width="175" height="174" rx="14" fill="url(#panSteel)" stroke="#7A8084" stroke-width="2"/>

    <!-- Wire Toggle Clasps on Short Ends (Top & Bottom) -->
    <!-- Top Clasp -->
    <rect x="156" y="85" width="18" height="16" rx="3" fill="url(#copper)" stroke="#6A3A22" stroke-width="1"/>
    <circle cx="165" cy="93" r="3" fill="#FFFFFF"/>
    <path d="M152 93 C152 79, 178 79, 178 93" fill="none" stroke="#DCE0E3" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom Clasp -->
    <rect x="156" y="259" width="18" height="16" rx="3" fill="url(#copper)" stroke="#6A3A22" stroke-width="1"/>
    <circle cx="165" cy="267" r="3" fill="#FFFFFF"/>
    <path d="M152 267 C152 281, 178 281, 178 267" fill="none" stroke="#DCE0E3" stroke-width="3" stroke-linecap="round"/>

    <!-- 6 Wells with Baked Golden Muffins (2 columns x 3 rows) -->
    <!-- Row 1 -->
    <g transform="translate(118, 122)">
      <circle cx="0" cy="0" r="21" fill="#B0B4B8" stroke="#7A8084" stroke-width="1"/>
      <circle cx="0" cy="0" r="19" fill="url(#linerPaper)"/>
      <circle cx="0" cy="0" r="17" fill="url(#muffinGold)"/>
      <ellipse cx="-4" cy="-5" rx="7" ry="4" fill="#FFF2DE" opacity="0.4"/>
    </g>
    <g transform="translate(196, 122)">
      <circle cx="0" cy="0" r="21" fill="#B0B4B8" stroke="#7A8084" stroke-width="1"/>
      <circle cx="0" cy="0" r="19" fill="url(#linerPaper)"/>
      <circle cx="0" cy="0" r="17" fill="url(#muffinGold)"/>
      <ellipse cx="-4" cy="-5" rx="7" ry="4" fill="#FFF2DE" opacity="0.4"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(118, 180)">
      <circle cx="0" cy="0" r="21" fill="#B0B4B8" stroke="#7A8084" stroke-width="1"/>
      <circle cx="0" cy="0" r="19" fill="url(#linerPaper)"/>
      <circle cx="0" cy="0" r="17" fill="url(#muffinGold)"/>
      <ellipse cx="-4" cy="-5" rx="7" ry="4" fill="#FFF2DE" opacity="0.4"/>
    </g>
    <g transform="translate(196, 180)">
      <circle cx="0" cy="0" r="21" fill="#B0B4B8" stroke="#7A8084" stroke-width="1"/>
      <circle cx="0" cy="0" r="19" fill="url(#linerPaper)"/>
      <circle cx="0" cy="0" r="17" fill="url(#muffinGold)"/>
      <ellipse cx="-4" cy="-5" rx="7" ry="4" fill="#FFF2DE" opacity="0.4"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(118, 238)">
      <circle cx="0" cy="0" r="21" fill="#B0B4B8" stroke="#7A8084" stroke-width="1"/>
      <circle cx="0" cy="0" r="19" fill="url(#linerPaper)"/>
      <circle cx="0" cy="0" r="17" fill="url(#muffinGold)"/>
      <ellipse cx="-4" cy="-5" rx="7" ry="4" fill="#FFF2DE" opacity="0.4"/>
    </g>
    <g transform="translate(196, 238)">
      <circle cx="0" cy="0" r="21" fill="#B0B4B8" stroke="#7A8084" stroke-width="1"/>
      <circle cx="0" cy="0" r="19" fill="url(#linerPaper)"/>
      <circle cx="0" cy="0" r="17" fill="url(#muffinGold)"/>
      <ellipse cx="-4" cy="-5" rx="7" ry="4" fill="#FFF2DE" opacity="0.4"/>
    </g>
  </g>

  <!-- Right Side: Clean Open Usable Space / Callout Card -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="115" width="185" height="130" rx="16" fill="#FFFFFF" stroke="#E2E4E6" stroke-width="1"/>
    <text x="362" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#25282B" text-anchor="middle">
      6 Standard Cups
    </text>
    <text x="362" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#B87352" text-anchor="middle">
      2 Columns × 3 Rows
    </text>
    <line x1="290" y1="178" x2="435" y2="178" stroke="#E6E9EC" stroke-width="1"/>
    <text x="362" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" fill="#606669" text-anchor="middle">
      2.30" Top Cavity Diameter
    </text>
    <text x="362" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" fill="#606669" text-anchor="middle">
      1.25" Standard Depth
    </text>
    <text x="362" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#25282B" text-anchor="middle">
      Dual End Wire Toggle Clasps
    </text>
  </g>

  <!-- Top Headline Pill -->
  <rect x="180" y="38" width="180" height="26" rx="13" fill="#FFFFFF" stroke="#B87352" stroke-width="1.2"/>
  <text x="270" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#B87352" text-anchor="middle">
    EXACTLY SIX CUPCAKE WELLS
  </text>

  <!-- Bottom Floating Badges -->
  <g transform="translate(60, 316)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#606669" text-anchor="middle">Aluminized Steel</text>
  </g>
  <g transform="translate(205, 316)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#606669" text-anchor="middle">2.45" Center Spacing</text>
  </g>
  <g transform="translate(350, 316)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#B87352" text-anchor="middle">No Full Pan Waste</text>
  </g>
</svg>
