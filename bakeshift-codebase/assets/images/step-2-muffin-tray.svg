<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E4E6"/>
      <stop offset="75%" stop-color="#CACDD0"/>
      <stop offset="100%" stop-color="#9DA3A6"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D48C6B"/>
      <stop offset="100%" stop-color="#B87352"/>
    </linearGradient>
  </defs>

  <!-- Base Pan Outline -->
  <rect x="45" y="45" width="370" height="170" rx="26" fill="#F0F2F4" stroke="#BDC1C4" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 6-Cup Muffin Tray Floating In with Motion Arrows -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="160" height="150" rx="14" fill="url(#panGrad)" stroke="#7A8084" stroke-width="2" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.15))"/>
    
    <!-- Tray Clasps -->
    <rect x="74" y="-7" width="14" height="14" rx="2" fill="url(#copper)"/>
    <circle cx="81" cy="0" r="2" fill="#FFFFFF"/>
    <rect x="74" y="143" width="14" height="14" rx="2" fill="url(#copper)"/>
    <circle cx="81" cy="150" r="2" fill="#FFFFFF"/>

    <!-- 6 Wells (2x3) -->
    <!-- Row 1 -->
    <circle cx="44" cy="30" r="18" fill="#B0B4B8" stroke="#7A8084" stroke-width="1.5"/>
    <circle cx="44" cy="30" r="13" fill="#D8DCE0"/>
    <circle cx="116" cy="30" r="18" fill="#B0B4B8" stroke="#7A8084" stroke-width="1.5"/>
    <circle cx="116" cy="30" r="13" fill="#D8DCE0"/>
    <!-- Row 2 -->
    <circle cx="44" cy="75" r="18" fill="#B0B4B8" stroke="#7A8084" stroke-width="1.5"/>
    <circle cx="44" cy="75" r="13" fill="#D8DCE0"/>
    <circle cx="116" cy="75" r="18" fill="#B0B4B8" stroke="#7A8084" stroke-width="1.5"/>
    <circle cx="116" cy="75" r="13" fill="#D8DCE0"/>
    <!-- Row 3 -->
    <circle cx="44" cy="120" r="18" fill="#B0B4B8" stroke="#7A8084" stroke-width="1.5"/>
    <circle cx="44" cy="120" r="13" fill="#D8DCE0"/>
    <circle cx="116" cy="120" r="18" fill="#B0B4B8" stroke="#7A8084" stroke-width="1.5"/>
    <circle cx="116" cy="120" r="13" fill="#D8DCE0"/>
  </g>

  <!-- Motion downward arrows -->
  <g stroke="#B87352" stroke-width="2.5" fill="none">
    <path d="M140 18 L140 38 M135 32 L140 38 L145 32"/>
  </g>

  <!-- Callout Label -->
  <rect x="250" y="100" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#B87352" stroke-width="1.5" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.06))"/>
  <text x="335" y="125" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="700" fill="#25282B" text-anchor="middle">
    2 × 3 GRID INSERT
  </text>
  <text x="335" y="145" font-family="-apple-system, Inter, sans-serif" font-size="10" fill="#B87352" text-anchor="middle">
    6.25" × 8.70" Footprint
  </text>
</svg>
