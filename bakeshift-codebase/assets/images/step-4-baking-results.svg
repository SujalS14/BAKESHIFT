<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E4E6"/>
      <stop offset="75%" stop-color="#CACDD0"/>
      <stop offset="100%" stop-color="#9DA3A6"/>
    </linearGradient>
    <linearGradient id="brownieGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A2E1A"/>
      <stop offset="70%" stop-color="#3D1E10"/>
      <stop offset="100%" stop-color="#281208"/>
    </linearGradient>
    <linearGradient id="muffinGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAA858"/>
      <stop offset="70%" stop-color="#C57E2E"/>
      <stop offset="100%" stop-color="#945414"/>
    </linearGradient>
  </defs>

  <rect x="45" y="45" width="370" height="170" rx="26" fill="url(#panGrad)" stroke="#9DA3A6" stroke-width="2"/>
  <rect x="56" y="55" width="348" height="150" rx="18" fill="#C2C6C9" stroke="#80868A" stroke-width="1.5"/>

  <!-- Left Side: 2x3 Muffin Insert with 6 Golden Cupcakes -->
  <g transform="translate(68, 62)">
    <rect x="0" y="0" width="150" height="136" rx="10" fill="#E2E4E6" stroke="#9DA3A6" stroke-width="1"/>
    <!-- 6 Muffins (2x3) -->
    <!-- Col 1 -->
    <circle cx="40" cy="28" r="16" fill="url(#muffinGold)"/>
    <circle cx="40" cy="68" r="16" fill="url(#muffinGold)"/>
    <circle cx="40" cy="108" r="16" fill="url(#muffinGold)"/>
    <!-- Col 2 -->
    <circle cx="110" cy="28" r="16" fill="url(#muffinGold)"/>
    <circle cx="110" cy="68" r="16" fill="url(#muffinGold)"/>
    <circle cx="110" cy="108" r="16" fill="url(#muffinGold)"/>
  </g>

  <!-- Divider Partition with Toggle Clasps -->
  <g>
    <rect x="230" y="55" width="6" height="150" fill="url(#panGrad)" stroke="#7A8084" stroke-width="1"/>
    <rect x="227" y="48" width="12" height="12" rx="2" fill="#B87352"/>
    <rect x="227" y="200" width="12" height="12" rx="2" fill="#B87352"/>
  </g>

  <!-- Right Side: Rich Chocolate Fudgy Brownie Zone -->
  <g transform="translate(244, 62)">
    <rect x="0" y="0" width="150" height="136" rx="10" fill="url(#brownieGold)"/>
    <!-- Brownie crinkle top pattern -->
    <path d="M20 30 Q50 40 80 25 T130 35" stroke="#7A4226" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M15 70 Q60 60 100 75 T135 65" stroke="#7A4226" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M25 110 Q70 120 110 105 T140 115" stroke="#7A4226" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Callout Pills -->
  <rect x="75" y="15" width="136" height="22" rx="11" fill="#FAF7F2" stroke="#B87352" stroke-width="1.5"/>
  <text x="143" y="30" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="700" fill="#B87352" text-anchor="middle">
    6 BREAKFAST MUFFINS
  </text>

  <rect x="250" y="15" width="136" height="22" rx="11" fill="#FAF7F2" stroke="#B87352" stroke-width="1.5"/>
  <text x="318" y="30" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="700" fill="#B87352" text-anchor="middle">
    FUDGY BROWNIES
  </text>
</svg>
