<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="panSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E4E6"/>
      <stop offset="70%" stop-color="#CACDD0"/>
      <stop offset="100%" stop-color="#B0B4B8"/>
    </linearGradient>
    <linearGradient id="innerSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CACDD0"/>
      <stop offset="100%" stop-color="#DCE0E3"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D48C6B"/>
      <stop offset="50%" stop-color="#B87352"/>
      <stop offset="100%" stop-color="#8E4828"/>
    </linearGradient>
    <linearGradient id="breadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4A864"/>
      <stop offset="70%" stop-color="#BF782C"/>
      <stop offset="100%" stop-color="#8B4A10"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#25282B" flood-opacity="0.14"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="275" rx="200" ry="25" fill="#25282B" opacity="0.08"/>

  <g filter="url(#softShadow)">
    <rect x="50" y="70" width="400" height="190" rx="28" fill="url(#panSteel)" stroke="#A0A5A8" stroke-width="2"/>
    <rect x="62" y="80" width="376" height="170" rx="20" fill="url(#innerSteel)" stroke="#888E92" stroke-width="1.5"/>
  </g>

  <!-- Side Handles -->
  <rect x="26" y="145" width="28" height="40" rx="10" fill="url(#panSteel)" stroke="#888E92" stroke-width="1.5"/>
  <rect x="34" y="155" width="12" height="20" rx="5" fill="#E8EAEB"/>
  <rect x="446" y="145" width="28" height="40" rx="10" fill="url(#panSteel)" stroke="#888E92" stroke-width="1.5"/>
  <rect x="454" y="155" width="12" height="20" rx="5" fill="#E8EAEB"/>

  <!-- 5" x 9" Loaf Zone (between X=180 and X=280, width=100, height=170) -->
  <rect x="180" y="80" width="100" height="170" rx="12" fill="url(#breadGold)" opacity="0.9"/>
  <!-- Crust score lines -->
  <path d="M205 100 Q230 110 255 100" stroke="#FFE4C2" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M205 140 Q230 150 255 140" stroke="#FFE4C2" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M205 180 Q230 190 255 180" stroke="#FFE4C2" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M205 220 Q230 230 255 220" stroke="#FFE4C2" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Partition 1 at X=180 -->
  <g>
    <rect x="177" y="80" width="7" height="170" fill="url(#panSteel)" stroke="#7A8084" stroke-width="1"/>
    <rect x="174" y="72" width="13" height="14" rx="2" fill="url(#copperGrad)"/>
    <circle cx="180.5" cy="79" r="2.5" fill="#FFFFFF"/>
    <rect x="174" y="244" width="13" height="14" rx="2" fill="url(#copperGrad)"/>
    <circle cx="180.5" cy="251" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Partition 2 at X=280 -->
  <g>
    <rect x="278" y="80" width="7" height="170" fill="url(#panSteel)" stroke="#7A8084" stroke-width="1"/>
    <rect x="275" y="72" width="13" height="14" rx="2" fill="url(#copperGrad)"/>
    <circle cx="281.5" cy="79" r="2.5" fill="#FFFFFF"/>
    <rect x="275" y="244" width="13" height="14" rx="2" fill="url(#copperGrad)"/>
    <circle cx="281.5" cy="251" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Dimension Indicator Lines -->
  <g stroke="#B87352" stroke-width="1.5">
    <line x1="180" y1="56" x2="280" y2="56"/>
    <line x1="180" y1="50" x2="180" y2="62"/>
    <line x1="280" y1="50" x2="280" y2="62"/>
  </g>

  <text x="230" y="48" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#B87352" text-anchor="middle">
    5.0 INCHES (5" × 9" LOAF)
  </text>
  <text x="230" y="165" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    ARTISAN LOAF
  </text>
  <text x="230" y="185" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="600" fill="#FFF2E0" text-anchor="middle">
    Sourdough & Banana Bread
  </text>
</svg>
