<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="clutterPan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E7378"/>
      <stop offset="100%" stop-color="#4A4E52"/>
    </linearGradient>
    <linearGradient id="bakeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E4E6"/>
      <stop offset="70%" stop-color="#CACDD0"/>
      <stop offset="100%" stop-color="#9DA3A6"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E09C7B"/>
      <stop offset="50%" stop-color="#B87352"/>
      <stop offset="100%" stop-color="#8E4828"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#25282B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="20"/>

  <!-- Top Pill Headline -->
  <rect x="155" y="30" width="230" height="26" rx="13" fill="#FFFFFF" stroke="#B87352" stroke-width="1.2"/>
  <text x="270" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#B87352" text-anchor="middle">
    70% CABINET SPACE RECLAIMED
  </text>

  <!-- LEFT: Cluttered Conventional Pans (5 stacked pans) -->
  <g transform="translate(40, 80)">
    <!-- Container Card -->
    <rect x="0" y="0" width="200" height="210" rx="16" fill="#F0F2F4" stroke="#DCE0E3" stroke-width="1"/>
    <text x="100" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#888E92" text-anchor="middle">
      CONVENTIONAL (5 PANS)
    </text>

    <!-- Stack of 5 clunky dark pans -->
    <!-- Pan 5: Cookie sheet -->
    <rect x="25" y="165" width="150" height="14" rx="4" fill="url(#clutterPan)" opacity="0.6"/>
    <!-- Pan 4: 9x13 Roaster -->
    <rect x="30" y="142" width="140" height="20" rx="5" fill="url(#clutterPan)" opacity="0.7"/>
    <!-- Pan 3: 9x9 Square Pan -->
    <rect x="45" y="116" width="110" height="22" rx="5" fill="url(#clutterPan)" opacity="0.8"/>
    <!-- Pan 2: Loaf Pan -->
    <rect x="55" y="88" width="90" height="24" rx="5" fill="url(#clutterPan)" opacity="0.9"/>
    <!-- Pan 1: 6-Cup Muffin Tin -->
    <rect x="35" y="58" width="130" height="26" rx="6" fill="url(#clutterPan)"/>
    <circle cx="55" cy="71" r="7" fill="#3D4044"/>
    <circle cx="75" cy="71" r="7" fill="#3D4044"/>
    <circle cx="95" cy="71" r="7" fill="#3D4044"/>
    <circle cx="115" cy="71" r="7" fill="#3D4044"/>
    <circle cx="135" cy="71" r="7" fill="#3D4044"/>

    <!-- Height bracket: 14.5" -->
    <g stroke="#9DA3A6" stroke-width="1.2">
      <line x1="184" y1="58" x2="184" y2="180"/>
      <line x1="180" y1="58" x2="188" y2="58"/>
      <line x1="180" y1="180" x2="188" y2="180"/>
    </g>
    <text x="100" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#6E7175" text-anchor="middle">
      14.5" Stacked Clutter
    </text>
  </g>

  <!-- VS CIRCLE IN CENTER -->
  <circle cx="270" cy="185" r="22" fill="#FFFFFF" stroke="#B87352" stroke-width="2" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))"/>
  <text x="270" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="800" fill="#B87352" text-anchor="middle">
    VS
  </text>

  <!-- RIGHT: BAKESHIFT 1 Sleek Pan -->
  <g transform="translate(300, 80)">
    <!-- Container Card -->
    <rect x="0" y="0" width="200" height="210" rx="16" fill="#FFFFFF" stroke="#B87352" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="100" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#B87352" text-anchor="middle">
      BAKESHIFT (1 SYSTEM)
    </text>

    <!-- 1 Slim Modular Pan with Nesting -->
    <rect x="20" y="125" width="160" height="34" rx="8" fill="url(#bakeSteel)" stroke="#80868A" stroke-width="1.5"/>
    <rect x="26" y="130" width="148" height="24" rx="5" fill="#D6D9DC"/>
    
    <!-- Nested Cupcake Tray inside pan -->
    <rect x="30" y="133" width="60" height="18" rx="4" fill="url(#bakeSteel)" stroke="#9DA3A6" stroke-width="1"/>
    <circle cx="40" cy="142" r="3" fill="#B0B4B8"/>
    <circle cx="50" cy="142" r="3" fill="#B0B4B8"/>
    <circle cx="60" cy="142" r="3" fill="#B0B4B8"/>
    <circle cx="70" cy="142" r="3" fill="#B0B4B8"/>
    <circle cx="80" cy="142" r="3" fill="#B0B4B8"/>

    <!-- Nested Partition Bars -->
    <line x1="100" y1="133" x2="100" y2="151" stroke="#888E92" stroke-width="2"/>
    <line x1="130" y1="133" x2="130" y2="151" stroke="#888E92" stroke-width="2"/>

    <!-- Handles -->
    <rect x="12" y="134" width="8" height="16" rx="2" fill="url(#bakeSteel)"/>
    <rect x="180" y="134" width="8" height="16" rx="2" fill="url(#bakeSteel)"/>

    <!-- Height bracket: 2.0" -->
    <g stroke="#B87352" stroke-width="1.5">
      <line x1="190" y1="125" x2="190" y2="159"/>
      <line x1="187" y1="125" x2="193" y2="125"/>
      <line x1="187" y1="159" x2="193" y2="159"/>
    </g>
    <text x="100" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#25282B" text-anchor="middle">
      2.0" Ultra-Slim Profile
    </text>
    <text x="100" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#B87352" text-anchor="middle">
      All Inserts Nest Completely
    </text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 316)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#606669" text-anchor="middle">13×9 Dish Replaced</text>
  </g>
  <g transform="translate(205, 316)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#606669" text-anchor="middle">Loaf &amp; Square Replaced</text>
  </g>
  <g transform="translate(350, 316)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#B87352" text-anchor="middle">100% Recyclable</text>
  </g>
</svg>
