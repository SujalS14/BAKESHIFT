<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="panSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E6E8EA"/>
      <stop offset="70%" stop-color="#C2C6CA"/>
      <stop offset="100%" stop-color="#9DA3A6"/>
    </linearGradient>
    <linearGradient id="panFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8CCD0"/>
      <stop offset="100%" stop-color="#E2E5E8"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E09C7B"/>
      <stop offset="50%" stop-color="#B87352"/>
      <stop offset="100%" stop-color="#8E4828"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAC0C4"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#25282B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="20"/>

  <!-- Pan Drop Shadow -->
  <ellipse cx="270" cy="305" rx="220" ry="24" fill="#25282B" opacity="0.10"/>

  <!-- Pan Outer Rim & Floor -->
  <g filter="url(#cardShadow)">
    <rect x="55" y="75" width="430" height="210" rx="30" fill="url(#panSteel)" stroke="#888E92" stroke-width="2"/>
    <rect x="70" y="88" width="400" height="184" rx="20" fill="url(#panFloor)" stroke="#7A8084" stroke-width="1.5"/>
  </g>

  <!-- Side Handles -->
  <rect x="28" y="160" width="30" height="42" rx="9" fill="url(#panSteel)" stroke="#80868A" stroke-width="1.5"/>
  <rect x="36" y="170" width="14" height="22" rx="4" fill="#F2EDE4"/>
  <rect x="482" y="160" width="30" height="42" rx="9" fill="url(#panSteel)" stroke="#80868A" stroke-width="1.5"/>
  <rect x="490" y="170" width="14" height="22" rx="4" fill="#F2EDE4"/>

  <!-- 1-Inch Spaced Laser Alignment Grooves -->
  <g stroke="#333639" stroke-width="1.8" opacity="0.75">
    <line x1="120" y1="75" x2="120" y2="82"/>
    <line x1="155" y1="75" x2="155" y2="82"/>
    <line x1="190" y1="75" x2="190" y2="82"/>
    <line x1="225" y1="75" x2="225" y2="84" stroke="url(#copper)" stroke-width="2.5"/>
    <line x1="260" y1="75" x2="260" y2="82"/>
    <line x1="295" y1="75" x2="295" y2="82"/>
    <line x1="330" y1="75" x2="330" y2="84" stroke="url(#copper)" stroke-width="2.5"/>
    <line x1="365" y1="75" x2="365" y2="82"/>
    <line x1="400" y1="75" x2="400" y2="82"/>
  </g>

  <!-- Sliding Motion Guide Dashed Arrows -->
  <g stroke="#B87352" stroke-width="2" stroke-dasharray="4,4" fill="none">
    <path d="M160 130 L220 130"/>
    <path d="M380 130 L325 130"/>
  </g>
  <polygon points="225,130 217,126 217,134" fill="#B87352"/>
  <polygon points="320,130 328,126 328,134" fill="#B87352"/>

  <!-- Partition 1 (at X=205, 8.9" length spanning width) -->
  <g filter="url(#cardShadow)">
    <rect x="202" y="88" width="8" height="184" fill="url(#panSteel)" stroke="#6A7074" stroke-width="1.5"/>
    <!-- Wire Toggle Clasp at Top End -->
    <rect x="198" y="78" width="16" height="18" rx="3" fill="url(#copper)" stroke="#5A2E1A" stroke-width="1"/>
    <circle cx="206" cy="87" r="3" fill="#FFFFFF"/>
    <path d="M194 87 C194 73, 218 73, 218 87" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Wire Toggle Clasp at Bottom End -->
    <rect x="198" y="264" width="16" height="18" rx="3" fill="url(#copper)" stroke="#5A2E1A" stroke-width="1"/>
    <circle cx="206" cy="273" r="3" fill="#FFFFFF"/>
    <path d="M194 273 C194 287, 218 287, 218 273" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Partition 2 (at X=315, 8.9" length spanning width) -->
  <g filter="url(#cardShadow)">
    <rect x="312" y="88" width="8" height="184" fill="url(#panSteel)" stroke="#6A7074" stroke-width="1.5"/>
    <!-- Wire Toggle Clasp at Top End -->
    <rect x="308" y="78" width="16" height="18" rx="3" fill="url(#copper)" stroke="#5A2E1A" stroke-width="1"/>
    <circle cx="316" cy="87" r="3" fill="#FFFFFF"/>
    <path d="M304 87 C304 73, 328 73, 328 87" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Wire Toggle Clasp at Bottom End -->
    <rect x="308" y="264" width="16" height="18" rx="3" fill="url(#copper)" stroke="#5A2E1A" stroke-width="1"/>
    <circle cx="316" cy="273" r="3" fill="#FFFFFF"/>
    <path d="M304 273 C304 287, 328 287, 328 273" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Formed Baking Zone Label (e.g. 5x9 Loaf zone in middle) -->
  <g filter="url(#cardShadow)">
    <rect x="220" y="150" width="82" height="60" rx="10" fill="#FFFFFF" stroke="#B87352" stroke-width="1.5"/>
    <text x="261" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#25282B" text-anchor="middle">
      5" × 9"
    </text>
    <text x="261" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#B87352" text-anchor="middle">
      LOAF ZONE
    </text>
  </g>

  <!-- Top Headline Pill -->
  <rect x="160" y="38" width="220" height="26" rx="13" fill="#FFFFFF" stroke="#B87352" stroke-width="1.2"/>
  <text x="270" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#B87352" text-anchor="middle">
    DUAL PARTITIONS • ZERO SILICONE
  </text>

  <!-- Bottom Floating Badges -->
  <g transform="translate(45, 316)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="70" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#606669" text-anchor="middle">1" Laser Guides (0.3mm)</text>
  </g>
  <g transform="translate(200, 316)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="70" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#B87352" text-anchor="middle">Wire Toggle Clasps</text>
  </g>
  <g transform="translate(355, 316)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#FFFFFF" stroke="#D0D4D8"/>
    <text x="70" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#606669" text-anchor="middle">8.9" × 1.65" Partitions</text>
  </g>
</svg>
